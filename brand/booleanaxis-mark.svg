<svg xmlns="http://www.w3.org/2000/svg" viewBox="95 30 410 350">

  <defs>
    <!-- Glow filter for the neon wireframe -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Base Glow for the axes -->
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(300, 240)">
    
    <!-- ========================================== -->
    <!-- 1. AXES LINES (Radiating from center)      -->
    <!-- ========================================== -->
    <g filter="url(#strongGlow)">
      <!-- Z Axis (Top Left) -->
      <line x1="0" y1="0" x2="-155.88" y2="-90" stroke="#00e5ff" stroke-width="2.5"/>
      <!-- X Axis (Bottom Left) -->
      <line x1="0" y1="0" x2="-155.88" y2="90" stroke="#ff3d3d" stroke-width="2.5"/>
      <!-- Y Axis 1 (Straight Up) -->
      <line x1="0" y1="0" x2="0" y2="-180" stroke="#d900ff" stroke-width="2.5"/>
      <!-- Y Axis 2 (Top Right) -->
      <line x1="0" y1="0" x2="155.88" y2="-90" stroke="#ff2a7a" stroke-width="2.5"/>
    </g>

    <!-- ========================================== -->
    <!-- 2. AXES ARROWS & LABELS                    -->
    <!-- ========================================== -->
    <!-- Z Axis -->
    <g transform="translate(-155.88, -90) rotate(-150)">
      <polygon points="12,0 -6,-7 -6,7" fill="#00e5ff"/>
    </g>
    <text x="-185" y="-105" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#00e5ff">Z</text>

    <!-- X Axis -->
    <g transform="translate(-155.88, 90) rotate(150)">
      <polygon points="12,0 -6,-7 -6,7" fill="#ff3d3d"/>
    </g>
    <text x="-185" y="115" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#ff3d3d">X</text>

    <!-- Y Axis 1 -->
    <g transform="translate(0, -180) rotate(-90)">
      <polygon points="12,0 -6,-7 -6,7" fill="#d900ff"/>
    </g>
    <text x="18" y="-180" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#d900ff">Y</text>

    <!-- Y Axis 2 -->
    <g transform="translate(155.88, -90) rotate(-30)">
      <polygon points="12,0 -6,-7 -6,7" fill="#ff2a7a"/>
    </g>
    <text x="175" y="-105" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#ff2a7a">Y</text>

    <!-- ========================================== -->
    <!-- 3. OUTER WIREFRAME CUBE                    -->
    <!-- ========================================== -->
    <g filter="url(#neonGlow)" stroke-width="1" opacity="0.7">
      <!-- Top Face -->
      <polygon points="0,-110 95.26,-55 0,0 -95.26,-55" fill="none" stroke="#b026ff"/>
      <line x1="-95.26" y1="-55" x2="95.26" y2="-55" stroke="#b026ff"/>
      <line x1="0" y1="-110" x2="0" y2="0" stroke="#b026ff"/>

      <!-- Left Face -->
      <polygon points="-95.26,-55 0,0 0,110 -95.26,55" fill="none" stroke="#00e5ff"/>
      <line x1="-95.26" y1="-55" x2="0" y2="110" stroke="#00e5ff"/>
      <line x1="-95.26" y1="55" x2="0" y2="0" stroke="#00e5ff"/>

      <!-- Right Face -->
      <polygon points="0,0 95.26,-55 95.26,55 0,110" fill="none" stroke="#ff2a7a"/>
      <line x1="95.26" y1="-55" x2="0" y2="110" stroke="#ff2a7a"/>
      <line x1="95.26" y1="55" x2="0" y2="0" stroke="#ff2a7a"/>
    </g>

    <!-- ========================================== -->
    <!-- 4. CONNECTING STRUCTURAL LINES             -->
    <!-- ========================================== -->
    <g stroke-width="1.5" opacity="0.6">
      <line x1="0" y1="-45" x2="0" y2="-110" stroke="#b026ff"/>
      <line x1="38.97" y1="-22.5" x2="95.26" y2="-55" stroke="#ff2a7a"/>
      <line x1="38.97" y1="22.5" x2="95.26" y2="55" stroke="#ff2a7a"/>
      <line x1="0" y1="45" x2="0" y2="110" stroke="#a133ff"/>
      <line x1="-38.97" y1="22.5" x2="-95.26" y2="55" stroke="#00e5ff"/>
      <line x1="-38.97" y1="-22.5" x2="-95.26" y2="-55" stroke="#00e5ff"/>
    </g>

    <!-- ========================================== -->
    <!-- 5. INNER SOLID CORE CUBE                   -->
    <!-- ========================================== -->
    <g>
      <!-- Solid Top Face -->
      <polygon points="0,-45 38.97,-22.5 0,0 -38.97,-22.5" fill="#050a17" stroke="#b026ff" stroke-width="2.5" stroke-linejoin="round"/>
      
      <!-- Solid Left Face -->
      <polygon points="-38.97,-22.5 0,0 0,45 -38.97,22.5" fill="#050a17" stroke="#00e5ff" stroke-width="2.5" stroke-linejoin="round"/>
      
      <!-- Solid Right Face -->
      <polygon points="0,0 38.97,-22.5 38.97,22.5 0,45" fill="#050a17" stroke="#ff2a7a" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- ========================================== -->
    <!-- 6. ISOMETRIC CORE TEXT ("0" and "1")       -->
    <!-- ========================================== -->
    <!-- Left Face ("0") -->
    <g transform="translate(-19.48, 11.25) skewY(30) scale(0.866, 1)">
      <!-- Inner bounding box -->
      <rect x="-16" y="-18" width="32" height="36" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
      <!-- The Zero -->
      <text x="0" y="2" font-family="monospace" font-size="34" font-weight="bold" fill="#00e5ff" text-anchor="middle" dominant-baseline="middle">0</text>
    </g>

    <!-- Right Face ("1") -->
    <g transform="translate(19.48, 11.25) skewY(-30) scale(0.866, 1)">
      <!-- Inner bounding box -->
      <rect x="-16" y="-18" width="32" height="36" fill="none" stroke="#ff2a7a" stroke-width="1.5"/>
      <!-- The One -->
      <text x="0" y="2" font-family="monospace" font-size="34" font-weight="bold" fill="#ff2a7a" text-anchor="middle" dominant-baseline="middle">1</text>
    </g>
  </g>
</svg>
